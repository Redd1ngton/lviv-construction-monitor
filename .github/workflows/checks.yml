name: Validate application
on:
  push:
    branches: [main]
    paths: ['frontend/**', 'functions/**', 'parser/**', 'scripts/**', 'tests/**', '.github/workflows/**']
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r parser/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node tests/frontend.cjs
      - run: node tests/datasets.cjs
      - run: node tests/collection.cjs
      - run: node tests/snapshots.cjs
      - run: node tests/status.cjs
      - run: node tests/parser-api.mjs
